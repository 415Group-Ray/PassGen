name: Publish PowerShell Module

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Test
        shell: pwsh
        run: |
          Invoke-Pester

      - name: Publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $moduleManifestPath = '.\module\PassGen2\PassGen2.psd1'
          $moduleMetadata = Import-PowerShellDataFile -Path $moduleManifestPath
          $moduleName = Split-Path -Path $moduleManifestPath -LeafBase
          $moduleVersion = [string]$moduleMetadata.ModuleVersion
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''

          Write-Host "Module Name: $moduleName"
          Write-Host "Module Version: $moduleVersion"
          Write-Host "Tag Version: $tagVersion"

          if ($tagVersion -and $tagVersion -ne $moduleVersion) {
            throw "Version mismatch: tag '$tagVersion' does not match module version '$moduleVersion'. Please update the module manifest or use the correct tag."
          }

          $publishedModule = Find-Module -Name $moduleName -RequiredVersion $moduleVersion -Repository PSGallery -ErrorAction SilentlyContinue

          if ($publishedModule) {
            Write-Host "Skipping publish: $moduleName version $moduleVersion is already available on PSGallery."
            exit 0
          }

          $retryCount = 0
          $maxRetries = 3
          do {
              try {
                  Publish-Module -Path .\module\PassGen2 -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery
                  $success = $true
              } catch {
                  $retryCount++
                  Start-Sleep -Seconds 5
              }
          } until ($success -or $retryCount -ge $maxRetries)
          
          if (-not $success) {
              throw "Failed to publish module after $maxRetries attempts."
          }
